<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    :root {
      --bg-main: #131525;
      --panel-bg: #1c1e36;
      --card-bg: #272a48;
      --accent-color: #a78bfa;
      --border-color: #2e3258;
      --text-main: #ffffff;
      --text-sub: #a3a8cc;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; direction: rtl; }

    .app-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 12px 24px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border-color); flex-wrap: wrap-reverse; gap: 12px; }
    .app-header h1 { font-size: 1.4rem; font-weight: 700; color: #b892ff; display: flex; align-items: center; gap: 8px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s; text-decoration: none; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-save { background: #10b981; }
    .btn-clear { background: #ef4444; }
    .btn-undo { background: #f59e0b; color: #000; }
    .btn-outline { background: #a855f7; }
    .btn-remove-bg { background: #ec4899; }
    .btn-upload { background: #6366f1; }

    .main-layout { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; }

    /* شاشة المرجع المصغرة على اليسار */
    .preview-panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 14px; width: 220px; min-width: 220px; display: flex; flex-direction: column; gap: 12px; }
    .preview-panel h4 { font-size: 0.9rem; color: var(--text-sub); text-align: center; }
    .preview-screen { width: 100%; height: 210px; background: #0f111a; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .preview-screen img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .placeholder-text { color: var(--text-sub); font-size: 0.8rem; text-align: center; }

    /* لوحة الرسم الرئيسية */
    .canvas-section { flex: 1; background: var(--panel-bg); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
    .canvas-header-bar { display: flex; justify-content: space-between; align-items: center; }
    .zoom-controls { display: flex; gap: 6px; align-items: center; }
    .zoom-btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .zoom-btn:hover { background: #343861; }
    .zoom-btn.active { background: #6366f1; border-color: #6366f1; }

    .canvas-container { background: #555870; border-radius: 8px; overflow: auto; height: 530px; display: flex; justify-content: center; align-items: center; position: relative; border: 1px solid var(--border-color); }
    canvas { display: block; background-color: #ffffff; cursor: crosshair; transform-origin: center center; transition: transform 0.05s ease-out; }

    /* القائمة الجانبية للأدوات */
    .sidebar { width: 310px; min-width: 310px; background: var(--panel-bg); padding: 16px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border-color); max-height: 85vh; overflow-y: auto; }
    .tool-section { border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }
    .tool-section:last-child { border-bottom: none; padding-bottom: 0; }
    .tool-section h3 { font-size: 0.88rem; margin-bottom: 10px; color: var(--text-sub); text-transform: uppercase; }

    .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tool-btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
    .tool-btn:hover { background: #343861; }
    .tool-btn.active { background: #6366f1; border-color: #6366f1; font-weight: bold; }

    .btn-magic-eraser { grid-column: span 2; background: #d946ef; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-magic-eraser.active { background: #a21caf; border: 2px solid white; }

    .color-palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
    .color-box { width: 100%; height: 28px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
    .color-box.active { border-color: white; transform: scale(1.1); }

    .range-container { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-sub); margin-top: 8px; }
    .range-container input[type="range"] { flex: 1; accent-color: var(--accent-color); }

    .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sticker-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 55px; }
    .sticker-card img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .site-link-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #ffffff; border: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="top-actions">
      <button id="btnSave" class="btn btn-save">💾 حفظ اللوحة</button>
      <button id="btnClear" class="btn btn-clear">🗑️ مسح الكل</button>
      <button id="btnUndo" class="btn btn-undo">↩️ تراجع</button>
      <button id="btnOutline" class="btn btn-outline">✨ تفريغ الألوان</button>
      <button id="btnRemoveBg" class="btn btn-remove-bg">🪄 إزالة الخلفية وتحديد الشخصية</button>
      <button type="button" id="btnUploadTrigger" class="btn btn-upload">📁 رفع صورة جديدة</button>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
    </div>
    <h1>تطبيق الرسم والتلوين الاحترافي 🟣</h1>
  </div>

  <div class="main-layout">
    
    <!-- شاشة المرجع المصغرة -->
    <div class="preview-panel">
      <h4>🖼️ المرجع المصغر</h4>
      <div class="preview-screen">
        <span class="placeholder-text" id="placeholderText">لا توجد صورة مرجع</span>
        <img id="previewImg" alt="مرجع الصورة المرفوعة">
      </div>
      <div id="insertionContainer" style="display: none; width: 100%;">
        <button type="button" class="btn btn-upload" id="btnPlaceOnCanvas" style="width:100%; justify-content:center;">📥 إدراج داخل اللوحة</button>
      </div>
    </div>

    <!-- لوحة الرسم والتحكم بالطرق والتكبير -->
    <div class="canvas-section">
      <div class="canvas-header-bar">
        <h3>لوحة الرسم والتلوين:</h3>
        <div class="zoom-controls">
          <button class="zoom-btn" id="btnPanHand">✋ تحريك الرسمة</button>
          <button class="zoom-btn" id="btnZoomIn">🔍+ تكبير</button>
          <button class="zoom-btn" id="btnZoomOut">🔍- تصغير</button>
          <button class="zoom-btn" id="btnZoomReset">🎯 إعادة ضبط</button>
          <span id="zoomLabel" style="font-size:0.8rem; color:var(--text-sub); margin-right:4px;">100%</span>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="paintCanvas" width="800" height="520"></canvas>
      </div>
    </div>

    <!-- الشريط الجانبي الشامل -->
    <aside class="sidebar">
      
      <div class="tool-section">
        <h3>🖌️ أدوات الرسم والممحاة</h3>
        <div class="grid-buttons">
          <button class="tool-btn active" id="btnBrush" data-tool="brush">فرشاة 🖌️</button>
          <button class="tool-btn" id="btnSpray" data-tool="spray">بخاخ 💨</button>
          <button class="tool-btn" id="btnFill" data-tool="fill">دلو تعبئة 🪣</button>
          <button class="tool-btn" id="btnEraser" data-tool="eraser">ممحاة عادية 🧹</button>
          <button class="btn-magic-eraser" id="btnMagicEraser" data-tool="magicEraser">✨ الممسحة السحرية (حذف لون)</button>
        </div>
      </div>

      <div class="tool-section">
        <h3>🎨 الألوان والتدرجات</h3>
        <div class="color-palette" id="colorPalette">
          <div class="color-box active" style="background:#000000" data-color="#000000"></div>
          <div class="color-box" style="background:#ef4444" data-color="#ef4444"></div>
          <div class="color-box" style="background:#f97316" data-color="#f97316"></div>
          <div class="color-box" style="background:#f59e0b" data-color="#f59e0b"></div>
          <div class="color-box" style="background:#10b981" data-color="#10b981"></div>
          <div class="color-box" style="background:#3b82f6" data-color="#3b82f6"></div>
          <div class="color-box" style="background:#6366f1" data-color="#6366f1"></div>
          <div class="color-box" style="background:#8b5cf6" data-color="#8b5cf6"></div>
          <div class="color-box" style="background:#ec4899" data-color="#ec4899"></div>
          <div class="color-box" style="background:#ffffff; border:1px solid #ccc" data-color="#ffffff"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:0.8rem; color:var(--text-sub);">لون مخصص:</label>
          <input type="color" id="customColor" value="#000000" style="border:none; background:transparent; cursor:pointer;">
        </div>
        <div class="range-container">
          <label>الحجم:</label>
          <input type="range" id="lineWidth" min="1" max="50" value="5">
          <span id="widthValue">5px</span>
        </div>
      </div>

      <div class="tool-section">
        <h3>📐 الأشكال الهندسية</h3>
        <div class="grid-buttons">
          <button class="tool-btn" data-tool="rect">مربع ⬛</button>
          <button class="tool-btn" data-tool="circle">دائرة ⚪</button>
          <button class="tool-btn" data-tool="triangle">مثلث 🔺</button>
          <button class="tool-btn" data-tool="star">نجمة ⭐</button>
        </div>
      </div>

      <div class="tool-section">
        <h3>🐼 مكتبة الملصقات (CLIPART)</h3>
        <div class="sticker-grid">
          <div class="sticker-card" data-svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%23f59e0b"/></svg>'><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%23f59e0b"/></svg>' alt="شمس"></div>
          <div class="sticker-card" data-svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%23ef4444"/></svg>'><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%23ef4444"/></svg>' alt="قلب"></div>
          <div class="sticker-card" data-svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%2310b981"/></svg>'><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="%2310b981"/></svg>' alt="كرة"></div>
        </div>
      </div>

      <div class="tool-section">
        <h3>🌐 مواقع رسم عالمية متخصصة</h3>
        <div class="grid-buttons">
          <a href="https://www.autodraw.com" target="_blank" class="tool-btn site-link-btn">🤖 AutoDraw</a>
          <a href="https://quickdraw.withgoogle.com" target="_blank" class="tool-btn site-link-btn">⚡ Quick Draw</a>
          <a href="https://sketchpad.app" target="_blank" class="tool-btn site-link-btn">🎨 Sketchpad</a>
          <a href="https://aggie.io" target="_blank" class="tool-btn site-link-btn">👥 Aggie.io</a>
          <a href="https://kleki.com" target="_blank" class="tool-btn site-link-btn" style="grid-column: span 2;">🖌️ Kleki Paint</a>
        </div>
      </div>

    </aside>

  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let isDrawing = false;
    let isPanning = false;
    let currentTool = 'brush';
    let currentColor = '#000000';
    let lineWidth = 5;
    let undoStack = [];

    // إعدادات التكبير والتصغير
    let zoomLevel = 1.0;
    let panX = 0, panY = 0;
    let startPanX = 0, startPanY = 0;

    function initCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function saveState() {
      if (undoStack.length >= 15) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    initCanvas();

    // التكبير والتصغير والتحريك
    function updateTransform() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
      document.getElementById('zoomLabel').innerText = `${Math.round(zoomLevel * 100)}%`;
    }

    document.getElementById('btnZoomIn').onclick = () => { if(zoomLevel < 3.0) { zoomLevel += 0.15; updateTransform(); } };
    document.getElementById('btnZoomOut').onclick = () => { if(zoomLevel > 0.4) { zoomLevel -= 0.15; updateTransform(); } };
    document.getElementById('btnZoomReset').onclick = () => { zoomLevel = 1.0; panX = 0; panY = 0; updateTransform(); };

    document.getElementById('btnPanHand').onclick = function() {
      document.querySelectorAll('.tool-btn, .btn-magic-eraser').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentTool = 'pan';
      canvas.style.cursor = 'grab';
    };

    // تغيير الأدوات والألوان
    document.querySelectorAll('[data-tool]').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tool-btn, .btn-magic-eraser, #btnPanHand').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        canvas.style.cursor = currentTool === 'eraser' ? 'cell' : 'crosshair';
      };
    });

    document.querySelectorAll('.color-box').forEach(box => {
      box.onclick = () => {
        document.querySelectorAll('.color-box').forEach(b => b.classList.remove('active'));
        box.classList.add('active');
        currentColor = box.dataset.color;
        document.getElementById('customColor').value = currentColor;
      };
    });

    document.getElementById('customColor').oninput = (e) => currentColor = e.target.value;
    document.getElementById('lineWidth').oninput = (e) => {
      lineWidth = e.target.value;
      document.getElementById('widthValue').innerText = `${lineWidth}px`;
    };

    // حساب أحداث الماوس بالكانفاس
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.onmousedown = (e) => {
      if (currentTool === 'pan') {
        isPanning = true;
        startPanX = e.clientX - panX;
        startPanY = e.clientY - panY;
        canvas.style.cursor = 'grabbing';
        return;
      }

      isDrawing = true;
      const pos = getPos(e);

      if (currentTool === 'magicEraser') {
        magicColorErase(pos.x, pos.y);
        saveState();
        isDrawing = false;
        return;
      }

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    };

    canvas.onmousemove = (e) => {
      if (isPanning) {
        panX = e.clientX - startPanX;
        panY = e.clientY - startPanY;
        updateTransform();
        return;
      }

      if (!isDrawing) return;
      const pos = getPos(e);

      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'brush') {
        ctx.strokeStyle = currentColor;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'eraser') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'spray') {
        ctx.fillStyle = currentColor;
        for (let i = 0; i < 10; i++) {
          ctx.fillRect(pos.x + (Math.random() - 0.5) * lineWidth * 2, pos.y + (Math.random() - 0.5) * lineWidth * 2, 1, 1);
        }
      }
    };

    canvas.onmouseup = () => {
      if (isPanning) { isPanning = false; canvas.style.cursor = 'grab'; }
      if (isDrawing) { isDrawing = false; saveState(); }
    };

    // الممسحة السحرية لحذف لون محدد
    function magicColorErase(startX, startY) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const idx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
      
      const tr = data[idx], tg = data[idx + 1], tb = data[idx + 2];
      for (let i = 0; i < data.length; i += 4) {
        if (Math.abs(data[i] - tr) < 35 && Math.abs(data[i + 1] - tg) < 35 && Math.abs(data[i + 2] - tb) < 35) {
          data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // إزالة الخلفية وتحديد شخصية الرسم بحد منقط ذكي
    document.getElementById('btnRemoveBg').onclick = function() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const w = canvas.width, h = canvas.height;

      // مسح الأبيض
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 210 && data[i + 1] > 210 && data[i + 2] > 210) {
          data[i] = 255; data[i + 1] = 255; data[i + 2] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      // رسم خط تحديد منقط حول الشخصية غير البيضاء
      ctx.save();
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      
      ctx.beginPath();
      let found = false;
      for (let y = 0; y < h; y += 4) {
        for (let x = 0; x < w; x += 4) {
          const idx = (y * w + x) * 4;
          if (data[idx] < 200 || data[idx + 1] < 200 || data[idx + 2] < 200) {
            if (!found) { ctx.moveTo(x, y); found = true; }
            else { ctx.lineTo(x, y); }
          }
        }
      }
      ctx.stroke();
      ctx.restore();
      saveState();
    };

    // أزرار التحكم العلوية
    document.getElementById('btnUndo').onclick = () => {
      if (undoStack.length > 1) {
        undoStack.pop();
        ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      }
    };

    document.getElementById('btnClear').onclick = () => initCanvas();

    document.getElementById('btnSave').onclick = () => {
      const a = document.createElement('a');
      a.download = 'my-drawing.png';
      a.href = canvas.toDataURL();
      a.click();
    };

    document.getElementById('btnOutline').onclick = () => {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = (data[i] + data[i + 1] + data[i + 2]) / 3 < 180 ? 0 : 255;
        data[i] = v; data[i + 1] = v; data[i + 2] = v;
      }
      ctx.putImageData(imgData, 0, 0);
      saveState();
    };

    // معالجة رفع الملفات والمشرع المصغر
    const btnUploadTrigger = document.getElementById('btnUploadTrigger');
    const imageLoader = document.getElementById('imageLoader');
    const previewImg = document.getElementById('previewImg');
    const placeholderText = document.getElementById('placeholderText');
    const btnPlaceOnCanvas = document.getElementById('btnPlaceOnCanvas');
    let loadedImg = null;

    btnUploadTrigger.onclick = () => imageLoader.click();

    imageLoader.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          loadedImg = new Image();
          loadedImg.onload = () => {
            previewImg.src = event.target.result;
            previewImg.style.display = 'block';
            placeholderText.style.display = 'none';
            document.getElementById('insertionContainer').style.display = 'block';
          };
          loadedImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    };

    btnPlaceOnCanvas.onclick = () => {
      if (loadedImg) {
        const scale = Math.min(canvas.width / loadedImg.width, canvas.height / loadedImg.height, 1);
        const w = loadedImg.width * scale;
        const h = loadedImg.height * scale;
        ctx.drawImage(loadedImg, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        saveState();
      }
    };
  </script>
</body>
</html>
