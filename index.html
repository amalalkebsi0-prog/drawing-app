<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو تحويل وتلوين الصور</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1050px;
            width: 100%;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls-panel {
            width: 100%;
            max-width: 320px;
            gap: 15px;
        }

        .canvas-panel {
            flex-grow: 1;
            max-width: 600px;
        }

        .section-title {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            align-self: flex-start;
        }

        .tools-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .tool-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .tool-row label {
            font-size: 0.9rem;
            color: #4b5563;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        input[type="range"] {
            width: 60%;
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 5px;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #6b7280;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .canvas-wrapper {
            position: relative;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: crosshair;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 400px;
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            font-weight: 600;
            color: var(--primary-color);
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>استوديو تحويل وتلوين الصور</h1>
        <p>ارفع أي صورة ملونة ليتم تحويلها مباشرة إلى رسمة أبيض وأسود جاهزة للتلوين</p>
    </header>

    <div class="main-container">
        <!-- لوحة التحكم -->
        <div class="card controls-panel">
            
            <div class="section-title">📁 ارفع صورة ملونة</div>
            <div class="upload-btn-wrapper">
                <button class="btn" style="background-color: #10b981;">اختر صورة من جهازك</button>
                <input type="file" id="imageUploader" accept="image/png, image/jpeg, image/jpg" />
            </div>

            <div class="tools-group">
                <div class="section-title" style="margin-bottom: 5px;">🎨 أدوات التلوين</div>
                
                <div class="tool-row">
                    <label>لون الفرشاة:</label>
                    <input type="color" id="colorPicker" value="#ff4757">
                </div>

                <div class="tool-row">
                    <label>حجم الفرشاة:</label>
                    <input type="range" id="brushSize" min="2" max="40" value="10">
                </div>

                <div class="tool-row" style="margin-top: 5px;">
                    <button class="btn btn-secondary" onclick="setEraser()" style="margin: 0; width: 48%;">ممحاة</button>
                    <button class="btn" onclick="setBrush()" style="margin: 0; width: 48%;">فرشاة</button>
                </div>
            </div>

            <div class="tools-group">
                <button class="btn btn-secondary" onclick="undoAction()" style="background-color: #f59e0b;">↩️ تراجع عن الخطوة</button>
                <button class="btn btn-secondary" onclick="clearCanvas()">مسح الألوان فقط</button>
                <button class="btn btn-secondary" onclick="resetCanvasBackground()" style="background-color: #ef4444;">مسح اللوحة بالكامل</button>
            </div>
        </div>

        <!-- لوحة الرسم والعرض -->
        <div class="card canvas-panel">
            <div class="section-title">لوحة الرسم والتلوين</div>
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="loading-overlay" id="loadingOverlay">
                    <span>جاري معالجة الصورة وتحويلها... ⏳</span>
                </div>
                <canvas id="drawingCanvas" width="500" height="380"></canvas>
            </div>
            
            <div class="actions-row">
                <button class="btn" onclick="saveImage()">💾 حفظ الصورة الملونة</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const imageUploader = document.getElementById('imageUploader');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let isDrawing = false;
        let isEraser = false;
        let currentImageObj = null;
        let undoStack = [];

        window.onload = () => {
            resetCanvasBackground();
            drawDefaultWelcome();
        };

        function drawDefaultWelcome() {
            ctx.fillStyle = "#6b7280";
            ctx.font = "16px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("قم برفع صورة ملونة من القائمة الجانبية للبدء", canvas.width / 2, canvas.height / 2);
        }

        function resetCanvasBackground() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            currentImageObj = null;
            undoStack = [];
            imageUploader.value = '';
        }

        function saveState() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > 20) undoStack.shift();
        }

        function undoAction() {
            if (undoStack.length > 0) {
                const prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            } else {
                alert("لا توجد خطوات للتراجع عنها!");
            }
        }

        // تحويل الصورة الملونة المرفوعة إلى أبيض وأسود تلقائياً
        imageUploader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadingOverlay.style.display = 'flex';

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    resetCanvasBackground();
                    
                    const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                    const newWidth = img.width * scale;
                    const newHeight = img.height * scale;
                    const x = (canvas.width / 2) - (newWidth / 2);
                    const y = (canvas.height / 2) - (newHeight / 2);

                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvas.width;
                    tempCanvas.height = canvas.height;
                    const tCtx = tempCanvas.getContext('2d');
                    tCtx.fillStyle = "#ffffff";
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    tCtx.drawImage(img, x, y, newWidth, newHeight);

                    const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                    const data = imgData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        let threshold = avg < 130 ? 0 : 255; 
                        data[i] = threshold;
                        data[i + 1] = threshold;
                        data[i + 2] = threshold;
                    }

                    tCtx.putImageData(imgData, 0, 0);
                    ctx.drawImage(tempCanvas, 0, 0);
                    
                    let processedImg = new Image();
                    processedImg.src = tempCanvas.toDataURL();
                    processedImg.onload = function() {
                        currentImageObj = processedImg;
                        saveState();
                        loadingOverlay.style.display = 'none';
                    };
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function clearCanvas() {
            if (confirm("هل أنت متأكد من مسح الألوان المضافة؟")) {
                if (currentImageObj) {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(currentImageObj, 0, 0, canvas.width, canvas.height);
                    saveState();
                } else {
                    resetCanvasBackground();
                    drawDefaultWelcome();
                }
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        function startPosition(e) {
            saveState();
            isDrawing = true;
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getMousePos(e);

            ctx.lineWidth = brushSize.value;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'multiply'; // يضمن بقاء الخطوط السوداء ظاهرة فوق الألوان
                ctx.strokeStyle = colorPicker.value;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition);

        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        function setEraser() { isEraser = true; }
        function setBrush() { isEraser = false; }

        function saveImage() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);

            const link = document.createElement('a');
            link.download = 'colored-artwork.png';
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
