<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الرسم والتلوين الاحترافي</title>
    <style>
        :root { --bg: #1e1e26; --panel: #2d2d3a; --accent: #6366f1; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        .toolbar { background: var(--panel); padding: 15px 25px; border-radius: 12px; display: flex; gap: 15px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        
        .canvas-area { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .canvas-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        
        canvas { background: white; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); cursor: crosshair; }
        
        button, select, input[type="range"] { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; background: #3f3f46; color: white; font-weight: bold; }
        button:hover { background: var(--accent); }
        
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.2); }
        
        .btn-action { background: #4f46e5; }
        .btn-clear { background: #ef4444; }
        .btn-undo { background: #f59e0b; }
    </style>
</head>
<body>

<div class="toolbar">
    <label style="background:var(--accent); padding:8px 15px; border-radius:6px; cursor:pointer;">
        رفع صورة جديدة 🖼️<input type="file" id="upload" accept="image/*" style="display:none;">
    </label>
    
    <select id="tool">
        <option value="pencil">✏️ قلم</option>
        <option value="brush">🖌️ فرشاة</option>
        <option value="fill">🪣 دلو التعبئة</option>
        <option value="eraser">🧹 ممحاة</option>
    </select>

    <div style="display: flex; align-items: center; gap: 5px;">
        <span>الحجم:</span>
        <input type="range" id="size" min="1" max="40" value="5">
    </div>

    <div id="palette" style="display:flex; gap:8px;"></div>

    <button class="btn-undo" onclick="undoAction()">↩️ تراجع</button>
    <button class="btn-action" onclick="clearColorsOnly()">🧼 تفريغ الألوان</button>
    <button class="btn-clear" onclick="clearAll()">🔄 مسح الكل</button>
</div>

<div class="canvas-area">
    <div class="canvas-card">
        <p>المرجع الملون:</p>
        <canvas id="ref" width="350" height="260"></canvas>
    </div>
    <div class="canvas-card">
        <p>لوحة الرسم والتلوين (مساحة واسعة):</p>
        <!-- لوحة رسم أكبر بكثير لتأخذ راحتك بالتلوين -->
        <canvas id="main" width="900" height="650"></canvas>
    </div>
</div>

<script>
    const refCanvas = document.getElementById('ref');
    const refCtx = refCanvas.getContext('2d');
    const mainCanvas = document.getElementById('main');
    const ctx = mainCanvas.getContext('2d');
    
    let color = '#000000';
    let drawing = false;
    let originalImageObj = null;
    let undoStack = [];

    // لوحة الألوان
    ['#000', '#f43f5e', '#22c55e', '#3b82f6', '#eab308', '#d946ef', '#06b6d4', '#f97316', '#ffffff'].forEach(c => {
        let b = document.createElement('div');
        b.className = 'color-btn'; 
        b.style.background = c;
        b.onclick = () => color = c;
        document.getElementById('palette').appendChild(b);
    });

    // حفظ الحالة الحالية للتراجع
    function saveState() {
        undoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
        if (undoStack.length > 20) undoStack.shift();
    }

    // زر التراجع
    function undoAction() {
        if (undoStack.length > 1) {
            undoStack.pop(); // إزالة الحالة الحالية
            let prevState = undoStack[undoStack.length - 1];
            ctx.putImageData(prevState, 0, 0);
        } else {
            alert("لا توجد خطوات إضافية للتراجع عنها!");
        }
    }

    // رفع الصورة الجديدة
    document.getElementById('upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
                ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                
                // رسم المرجع
                refCtx.drawImage(img, 0, 0, refCanvas.width, refCanvas.height);
                
                // رسم الصورة في لوحة التلوين بحجم متناسب وكبير
                ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);
                
                // تخزين الصورة الأصلية للرجوع لها عند تفريغ الألوان
                originalImageObj = img;
                undoStack = [];
                saveState();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // تفريغ الألوان فقط (إعادة الصورة الأصلية كما رُفعت بدون ألوان إضافية)
    function clearColorsOnly() {
        if (!originalImageObj) {
            alert("الرجاء رفع صورة أولاً!");
            return;
        }
        ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        ctx.drawImage(originalImageObj, 0, 0, mainCanvas.width, mainCanvas.height);
        saveState();
    }

    // مسح اللوحة تماماً
    function clearAll() {
        if (confirm("هل تريد مسح اللوحة بالكامل؟")) {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
            originalImageObj = null;
            undoStack = [];
        }
    }

    // التعامل مع الفأرة للرسم والتلوين
    mainCanvas.onmousedown = (e) => {
        const {x, y} = getPos(e);
        const tool = document.getElementById('tool').value;
        
        if (tool === 'fill') {
            saveState();
            floodFill(Math.floor(x), Math.floor(y), hexToRgb(color));
        } else {
            saveState();
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    };

    mainCanvas.onmousemove = (e) => {
        if (!drawing) return;
        const {x, y} = getPos(e);
        const tool = document.getElementById('tool').value;
        
        ctx.lineWidth = document.getElementById('size').value;
        ctx.strokeStyle = (tool === 'eraser') ? '#ffffff' : color;
        
        if (tool === 'brush') {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        } else {
            ctx.lineCap = 'square';
            ctx.lineJoin = 'miter';
        }
        
        ctx.lineTo(x, y);
        ctx.stroke();
    };

    mainCanvas.onmouseup = () => { 
        if (drawing) {
            drawing = false; 
            ctx.beginPath();
        }
    };

    function getPos(e) {
        const rect = mainCanvas.getBoundingClientRect();
        return { 
            x: e.clientX - rect.left, 
            y: e.clientY - rect.top 
        };
    }

    // خوارزمية دلو التعبئة التلقائية (Flood Fill)
    function floodFill(startX, startY, fillColor) {
        const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
        const data = imgData.data;
        const width = mainCanvas.width;
        const height = mainCanvas.height;
        
        const startPos = (startY * width + startX) * 4;
        const startR = data[startPos];
        const startG = data[startPos+1];
        const startB = data[startPos+2];
        const startA = data[startPos+3];
        
        if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;
        
        let queue = [[startX, startY]];
        
        while (queue.length > 0) {
            let [x, y] = queue.pop();
            let currentPos = (y * width + x) * 4;
            
            if (x >= 0 && x < width && y >= 0 && y < height &&
                data[currentPos] === startR &&
                data[currentPos+1] === startG &&
                data[currentPos+2] === startB &&
                data[currentPos+3] === startA) {
                
                data[currentPos] = fillColor.r;
                data[currentPos+1] = fillColor.g;
                data[currentPos+2] = fillColor.b;
                data[currentPos+3] = 255;
                
                queue.push([x + 1, y]);
                queue.push([x - 1, y]);
                queue.push([x, y + 1]);
                queue.push([x, y - 1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function hexToRgb(hex) {
        return {
            r: parseInt(hex.slice(1,3), 16),
            g: parseInt(hex.slice(3,5), 16),
            b: parseInt(hex.slice(5,7), 16)
        };
    }
</script>
</body>
</html>
