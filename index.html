<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #12121e;
      color: #ffffff;
      padding: 20px;
      direction: rtl;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e2e;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      gap: 15px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      color: #f1f5f9;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #3b82f6; }
    .btn-purple { background: #8b5cf6; }
    .btn-warning { background: #f59e0b; color: #111; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #10b981; }

    .main-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    /* الشريط الجانبي الأيمن */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: #1e1e2e;
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .tool-section {
      border-bottom: 1px solid #313244;
      padding-bottom: 14px;
    }

    .tool-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tool-section h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #cdd6f4;
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .color-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-dot.active, .color-dot:hover {
      border-color: #ffffff;
      transform: scale(1.1);
    }

    .custom-color-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #a6adc8;
    }

    .custom-color-picker input {
      border: none;
      background: transparent;
      width: 40px;
      height: 30px;
      cursor: pointer;
    }

    .range-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-container input { flex: 1; }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tool-btn.active {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
    }

    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .emoji-btn {
      background: #313244;
      border: 1px solid #45475a;
      font-size: 1.3rem;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .emoji-btn.active { background: #89b4fa; }

    /* منطقة الكانفاس */
    .content-area {
      flex: 1;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .canvas-wrapper, .reference-wrapper {
      background: #1e1e2e;
      padding: 18px;
      border-radius: 12px;
    }

    .canvas-container {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      display: block;
      margin-top: 10px;
    }

    canvas {
      display: block;
      background-color: #ffffff;
      cursor: crosshair;
    }

    #referenceImage {
      max-width: 250px;
      max-height: 350px;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <h1>🎨 تطبيق الرسم والتلوين الاحترافي</h1>
    <div class="top-actions">
      <label for="imageLoader" class="btn btn-primary">📁 رفع صورة جديدة</label>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
      <button id="btnOutline" class="btn btn-purple">✨ تفريغ الألوان (أسود وأبيض)</button>
      <button id="btnUndo" class="btn btn-warning">↩️ تراجع</button>
      <button id="btnClear" class="btn btn-danger">🗑️ مسح الكل</button>
      <button id="btnSave" class="btn btn-success">💾 حفظ اللوحة</button>
    </div>
  </div>

  <div class="main-layout">
    
    <aside class="sidebar">
      <div class="tool-section">
        <h3>🎨 الألوان</h3>
        <div class="color-palette" id="colorPalette">
          <div class="color-dot active" style="background: #000000" data-color="#000000"></div>
          <div class="color-dot" style="background: #e63946" data-color="#e63946"></div>
          <div class="color-dot" style="background: #457b9d" data-color="#457b9d"></div>
          <div class="color-dot" style="background: #2a9d8f" data-color="#2a9d8f"></div>
          <div class="color-dot" style="background: #e9c46a" data-color="#e9c46a"></div>
          <div class="color-dot" style="background: #f4a261" data-color="#f4a261"></div>
          <div class="color-dot" style="background: #e76f51" data-color="#e76f51"></div>
          <div class="color-dot" style="background: #9b5de5" data-color="#9b5de5"></div>
          <div class="color-dot" style="background: #f15bb5" data-color="#f15bb5"></div>
          <div class="color-dot" style="background: #ffffff; border: 1px solid #ccc" data-color="#ffffff"></div>
        </div>
        <div class="custom-color-picker">
          <label for="customColor">لون مخصص:</label>
          <input type="color" id="customColor" value="#000000">
        </div>
      </div>

      <div class="tool-section">
        <h3>📏 الحجم / السماكة</h3>
        <div class="range-container">
          <input type="range" id="lineWidth" min="1" max="50" value="5">
          <span id="widthValue">5 px</span>
        </div>
      </div>

      <div class="tool-section">
        <h3>🖌️ الفرش والأدوات</h3>
        <div class="grid-buttons">
          <button class="tool-btn active" data-tool="brush">🖌️ فرشاة</button>
          <button class="tool-btn" data-tool="spray">💨 بخاخ</button>
          <button class="tool-btn" data-tool="eraser">🧹 ممحاة</button>
        </div>
      </div>

      <div class="tool-section">
        <h3>📐 الأشكال الهندسية</h3>
        <div class="grid-buttons">
          <button class="tool-btn" data-tool="rectangle">⬛ مربع</button>
          <button class="tool-btn" data-tool="circle">⚪ دائرة</button>
          <button class="tool-btn" data-tool="triangle">🔺 مثلث</button>
          <button class="tool-btn" data-tool="star">⭐ نجمة</button>
        </div>
      </div>

      <div class="tool-section">
        <h3>😃 الملصقات</h3>
        <div class="emoji-picker">
          <button class="emoji-btn" data-emoji="⭐">⭐</button>
          <button class="emoji-btn" data-emoji="❤️">❤️</button>
          <button class="emoji-btn" data-emoji="🔥">🔥</button>
          <button class="emoji-btn" data-emoji="👑">👑</button>
        </div>
      </div>
    </aside>

    <main class="content-area">
      <div class="canvas-wrapper">
        <h3>لوحة الرسم والتلوين:</h3>
        <div class="canvas-container">
          <canvas id="paintCanvas" width="800" height="550"></canvas>
        </div>
      </div>

      <div class="reference-wrapper" id="referenceWrapper" style="display:none;">
        <h3>المرجع الملون:</h3>
        <img id="referenceImage" src="" alt="مرجع الصورة">
      </div>
    </main>

  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    let isDrawing = false;
    let startX = 0, startY = 0;
    let snapshot = null;

    let currentTool = 'brush';
    let currentColor = '#000000';
    let lineWidth = 5;
    let selectedEmoji = '⭐';

    let originalImage = null;
    let undoStack = [];

    // إعداد مساحة اللوحة باللون الأبيض
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState();

    function saveState() {
      if (undoStack.length >= 15) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    document.getElementById('btnUndo').onclick = () => {
      if (undoStack.length > 1) {
        undoStack.pop();
        ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      }
    };

    document.getElementById('btnClear').onclick = () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    };

    document.getElementById('btnSave').onclick = () => {
      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = canvas.toDataURL();
      link.click();
    };

    // رفع صورة
    document.getElementById('imageLoader').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          saveState();

          document.getElementById('referenceImage').src = img.src;
          document.getElementById('referenceWrapper').style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // تفريغ الألوان بالأسود والأبيض
    document.getElementById('btnOutline').onclick = () => {
      if (!originalImage) {
        alert('يرجى رفع صورة أولاً!');
        return;
      }

      ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        let v = avg < 140 ? 0 : 255;
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
      }

      ctx.putImageData(imgData, 0, 0);
      saveState();
    };

    // اختيار الأدوات والألوان
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
      };
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.onclick = () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.dataset.color;
      };
    });

    document.getElementById('customColor').oninput = (e) => currentColor = e.target.value;
    document.getElementById('lineWidth').oninput = (e) => {
      lineWidth = e.target.value;
      document.getElementById('widthValue').innerText = `${lineWidth} px`;
    };

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.onclick = () => {
        selectedEmoji = btn.dataset.emoji;
        currentTool = 'emoji';
      };
    });

    // أحداث الرسم
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.onmousedown = (e) => {
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (currentTool === 'emoji') {
        ctx.font = `${lineWidth * 5}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText(selectedEmoji, startX, startY);
        saveState();
        isDrawing = false;
      } else {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    };

    canvas.onmousemove = (e) => {
      if (!isDrawing) return;
      const pos = getPos(e);

      if (['rectangle', 'circle', 'triangle', 'star'].includes(currentTool)) {
        ctx.putImageData(snapshot, 0, 0);
      }

      ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
      ctx.fillStyle = currentColor;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';

      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'spray') {
        for (let i = 0; i < 15; i++) {
          ctx.fillRect(pos.x + (Math.random() - 0.5) * lineWidth * 2, pos.y + (Math.random() - 0.5) * lineWidth * 2, 1, 1);
        }
      } else if (currentTool === 'rectangle') {
        ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
      } else if (currentTool === 'circle') {
        ctx.beginPath();
        ctx.arc(startX, startY, Math.hypot(pos.x - startX, pos.y - startY), 0, Math.PI * 2);
        ctx.stroke();
      }
    };

    canvas.onmouseup = () => {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
    };
  </script>
</body>
</html>
