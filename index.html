<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الرسم والتلوين - إصدار محدث</title>
    <style>
        body { background: #333; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; color: white; }
        .toolbar { background: #444; padding: 15px; border-radius: 8px; display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .canvas-area { display: flex; gap: 30px; }
        canvas { border: 5px solid #fff; background: white; cursor: crosshair; }
        .color-btn { width: 30px; height: 30px; border: 2px solid #fff; cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="upload" accept="image/*">
    <select id="tool">
        <option value="pencil">قلم</option>
        <option value="brush">فرشاة</option>
        <option value="fill">دلو التعبئة</option>
        <option value="eraser">ممحاة</option>
    </select>
    <input type="range" id="size" min="1" max="50" value="5">
    <div id="palette" style="display:flex; gap:5px;"></div>
    <button onclick="clearAll()">مسح اللوحة</button>
</div>

<div class="canvas-area">
    <div><p>الصورة الأصلية (مرجع):</p><canvas id="ref" width="300" height="225"></canvas></div>
    <div><p>لوحة الرسم:</p><canvas id="main" width="800" height="600"></canvas></div>
</div>

<script>
    const refCanvas = document.getElementById('ref');
    const refCtx = refCanvas.getContext('2d');
    const mainCanvas = document.getElementById('main');
    const ctx = mainCanvas.getContext('2d');
    let color = '#000000', drawing = false;

    // إضافة الألوان
    ['#000', '#f00', '#0f0', '#00f', '#ff0', '#f0f', '#0ff', '#ffa500'].forEach(c => {
        let b = document.createElement('div');
        b.className = 'color-btn'; b.style.background = c;
        b.onclick = () => color = c;
        document.getElementById('palette').appendChild(b);
    });

    document.getElementById('upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                // [حل المشكلة]: مسح اللوحات تماماً قبل رسم الصورة الجديدة
                refCtx.clearRect(0, 0, 300, 225);
                ctx.clearRect(0, 0, 800, 600);
                
                // رسم الصور الجديدة
                refCtx.drawImage(img, 0, 0, 300, 225);
                ctx.drawImage(img, 0, 0, 800, 600);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // منطق الرسم
    mainCanvas.onmousedown = (e) => {
        const rect = mainCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left, y = e.clientY - rect.top;
        if(document.getElementById('tool').value === 'fill') {
            floodFill(x, y, hexToRgb(color));
        } else {
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    };

    mainCanvas.onmousemove = (e) => {
        if(!drawing) return;
        const rect = mainCanvas.getBoundingClientRect();
        const tool = document.getElementById('tool').value;
        ctx.lineWidth = document.getElementById('size').value;
        ctx.strokeStyle = (tool === 'eraser') ? '#fff' : color;
        ctx.lineCap = (tool === 'brush') ? 'round' : 'square';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
    };

    mainCanvas.onmouseup = () => drawing = false;

    // وظيفة الدلو
    function floodFill(startX, startY, fillColor) {
        const imageData = ctx.getImageData(0, 0, 800, 600);
        const data = imageData.data;
        const startPos = (Math.floor(startY) * 800 + Math.floor(startX)) * 4;
        const startR = data[startPos], startG = data[startPos+1], startB = data[startPos+2];
        
        if(startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;
        
        let pixelStack = [[Math.floor(startX), Math.floor(startY)]];
        while(pixelStack.length) {
            let [x, y] = pixelStack.pop();
            let pos = (y * 800 + x) * 4;
            if(x>=0 && x<800 && y>=0 && y<600 && data[pos] === startR && data[pos+1] === startG && data[pos+2] === startB) {
                data[pos] = fillColor.r; data[pos+1] = fillColor.g; data[pos+2] = fillColor.b; data[pos+3] = 255;
                pixelStack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    function hexToRgb(hex) {
        let r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
        return {r, g, b};
    }

    function clearAll() { ctx.clearRect(0,0,800,600); }
</script>
</body>
</html>
