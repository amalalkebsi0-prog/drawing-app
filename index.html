<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    /* ====================
       التنسيقات والتصميم (CSS)
       ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background-color: #12121e;
      color: #ffffff;
      padding: 20px;
      direction: rtl;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e2e;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
      gap: 15px;
    }

    .app-header h1 {
      font-size: 1.5rem;
      color: #f1f5f9;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary { background: #3b82f6; }
    .btn-purple { background: #8b5cf6; }
    .btn-warning { background: #f59e0b; color: #111; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #10b981; }

    /* التخطيط */
    .main-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    /* الشريط الجانبي الأيمن */
    .sidebar {
      width: 320px;
      min-width: 320px;
      background: #1e1e2e;
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      max-height: 85vh;
      overflow-y: auto;
    }

    .tool-section {
      border-bottom: 1px solid #313244;
      padding-bottom: 14px;
    }

    .tool-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tool-section h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #cdd6f4;
    }

    /* لوحة الألوان */
    .color-palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .color-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .color-dot:hover, .color-dot.active {
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .custom-color-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.85rem;
      color: #a6adc8;
    }

    .custom-color-picker input {
      border: none;
      background: transparent;
      width: 45px;
      height: 30px;
      cursor: pointer;
    }

    /* شريط التحكم بالسماكة */
    .range-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-container input[type="range"] {
      flex: 1;
      accent-color: #89b4fa;
      cursor: pointer;
    }

    .range-container span {
      font-size: 0.85rem;
      min-width: 45px;
      color: #a6adc8;
    }

    /* شبكة أزرار الأدوات */
    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: #45475a;
    }

    .tool-btn.active {
      background: #89b4fa;
      color: #11111b;
      font-weight: bold;
      border-color: #89b4fa;
    }

    .checkbox-option {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #a6adc8;
      cursor: pointer;
    }

    .checkbox-option input {
      cursor: pointer;
    }

    /* أزرار الملصقات */
    .emoji-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .emoji-btn {
      background: #313244;
      border: 1px solid #45475a;
      font-size: 1.4rem;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .emoji-btn:hover {
      background: #45475a;
    }

    .emoji-btn.active {
      background: #89b4fa;
      border-color: #89b4fa;
      transform: scale(1.05);
    }

    /* منطقة الكانفاس واللوحة */
    .content-area {
      flex: 1;
      display: flex;
      gap: 20px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .canvas-wrapper, .reference-wrapper {
      background: #1e1e2e;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .canvas-wrapper h3, .reference-wrapper h3 {
      font-size: 1rem;
      color: #cdd6f4;
      margin-bottom: 10px;
    }

    .canvas-container {
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      display: inline-block;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background-color: #ffffff;
      cursor: crosshair;
    }

    #referenceImage {
      max-width: 280px;
      max-height: 380px;
      border-radius: 8px;
      border: 2px solid #313244;
      display: block;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- شريط الأزرار العلوي -->
  <div class="app-header">
    <h1>🎨 تطبيق الرسم والتلوين الاحترافي</h1>
    <div class="top-actions">
      <label for="imageLoader" class="btn btn-primary">📁 رفع صورة جديدة</label>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
      <button id="btnOutline" class="btn btn-purple">✨ تفريغ الألوان (أسود وأبيض)</button>
      <button id="btnUndo" class="btn btn-warning">↩️ تراجع</button>
      <button id="btnClear" class="btn btn-danger">🗑️ مسح الكل</button>
      <button id="btnSave" class="btn btn-success">💾 حفظ اللوحة</button>
    </div>
  </div>

  <!-- الجسم الرئيسي للتطبيق -->
  <div class="main-layout">
    
    <!-- الشريط الجانبي الأيمن لجميع الأدوات -->
    <aside class="sidebar">
      
      <!-- الألوان -->
      <div class="tool-section">
        <h3>🎨 الألوان</h3>
        <div class="color-palette" id="colorPalette">
          <div class="color-dot active" style="background: #000000" data-color="#000000"></div>
          <div class="color-dot" style="background: #e63946" data-color="#e63946"></div>
          <div class="color-dot" style="background: #457b9d" data-color="#457b9d"></div>
          <div class="color-dot" style="background: #2a9d8f" data-color="#2a9d8f"></div>
          <div class="color-dot" style="background: #e9c46a" data-color="#e9c46a"></div>
          <div class="color-dot" style="background: #f4a261" data-color="#f4a261"></div>
          <div class="color-dot" style="background: #e76f51" data-color="#e76f51"></div>
          <div class="color-dot" style="background: #9b5de5" data-color="#9b5de5"></div>
          <div class="color-dot" style="background: #f15bb5" data-color="#f15bb5"></div>
          <div class="color-dot" style="background: #ffffff; border: 1px solid #ccc" data-color="#ffffff"></div>
        </div>
        <div class="custom-color-picker">
          <label for="customColor">اختر لوناً مخصصاً:</label>
          <input type="color" id="customColor" value="#000000">
        </div>
      </div>

      <!-- الحجم وسماكة الفرشاة -->
      <div class="tool-section">
        <h3>📏 الحجم / السماكة</h3>
        <div class="range-container">
          <input type="range" id="lineWidth" min="1" max="60" value="5">
          <span id="widthValue">5 px</span>
        </div>
      </div>

      <!-- الفرش والأدوات -->
      <div class="tool-section">
        <h3>🖌️ الفرش والأدوات</h3>
        <div class="grid-buttons">
          <button class="tool-btn active" data-tool="brush">🖌️ فرشاة ناعمة</button>
          <button class="tool-btn" data-tool="pen">✏️ قلم حاد</button>
          <button class="tool-btn" data-tool="spray">💨 بخاخ</button>
          <button class="tool-btn" data-tool="eraser">🧹 ممحاة</button>
          <button class="tool-btn" data-tool="fill">🪣 دلو تعبئة</button>
        </div>
      </div>

      <!-- الأشكال الهندسية -->
      <div class="tool-section">
        <h3>📐 الأشكال الهندسية</h3>
        <div class="grid-buttons">
          <button class="tool-btn" data-tool="rectangle">⬛ مربع</button>
          <button class="tool-btn" data-tool="circle">⚪ دائرة</button>
          <button class="tool-btn" data-tool="triangle">🔺 مثلث</button>
          <button class="tool-btn" data-tool="star">⭐ نجمة</button>
          <button class="tool-btn" data-tool="line">📏 خط مستقيم</button>
        </div>
        <label class="checkbox-option">
          <input type="checkbox" id="fillShape">
          تعبئة الشكل باللون
        </label>
      </div>

      <!-- الملصقات -->
      <div class="tool-section">
        <h3>😃 الملصقات</h3>
        <div class="emoji-picker" id="emojiPicker">
          <button class="emoji-btn" data-emoji="⭐">⭐</button>
          <button class="emoji-btn" data-emoji="❤️">❤️</button>
          <button class="emoji-btn" data-emoji="🔥">🔥</button>
          <button class="emoji-btn" data-emoji="🎉">🎉</button>
          <button class="emoji-btn" data-emoji="👑">👑</button>
          <button class="emoji-btn" data-emoji="🚀">🚀</button>
          <button class="emoji-btn" data-emoji="🌈">🌈</button>
          <button class="emoji-btn" data-emoji="🌸">🌸</button>
        </div>
      </div>

    </aside>

    <!-- منطقة الكانفاس للرسم والصورة المرجعية -->
    <main class="content-area">
      <div class="canvas-wrapper">
        <h3>لوحة الرسم والتلوين (دقة عالية):</h3>
        <div class="canvas-container">
          <canvas id="paintCanvas" width="800" height="600"></canvas>
        </div>
      </div>

      <div class="reference-wrapper" id="referenceWrapper" style="display:none;">
        <h3>المرجع الملون:</h3>
        <img id="referenceImage" src="" alt="مرجع الصورة">
      </div>
    </main>

  </div>

  <!-- البرمجة والتفاعلات (JavaScript) -->
  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // المتغيرات العامة
    let isDrawing = false;
    let startX = 0, startY = 0;
    let snapshot = null;

    let currentTool = 'brush';
    let currentColor = '#000000';
    let lineWidth = 5;
    let fillShape = false;
    let selectedEmoji = '⭐';

    let originalImage = null;
    let undoStack = [];
    const MAX_UNDO = 25;

    // تعبئة اللوحة باللون الأبيض عند البداية
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveState();

    function saveState() {
      if (undoStack.length >= MAX_UNDO) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    // زر التراجع
    document.getElementById('btnUndo').addEventListener('click', () => {
      if (undoStack.length > 1) {
        undoStack.pop();
        ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      }
    });

    // زر مسح اللوحة
    document.getElementById('btnClear').addEventListener('click', () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    });

    // زر حفظ الرسمة
    document.getElementById('btnSave').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'my-painting.png';
      link.href = canvas.toDataURL();
      link.click();
    });

    // رفع صورة جديدة
    document.getElementById('imageLoader').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          
          // ضبط أبعاد اللوحة بحجم الصورة الأصلي لدقة عالية
          canvas.width = img.naturalWidth || 800;
          canvas.height = img.naturalHeight || 600;
          
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          saveState();

          // إظهار المرجع الملون
          const refImg = document.getElementById('referenceImage');
          refImg.src = img.src;
          document.getElementById('referenceWrapper').style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // خوارزمية تفريغ الألوان الحادة (Sobel Edge Detection)
    document.getElementById('btnOutline').addEventListener('click', () => {
      if (!originalImage) {
        alert('الرجاء رفع صورة أولاً لتفريغ ألوانها!');
        return;
      }

      const width = canvas.width;
      const height = canvas.height;

      ctx.drawImage(originalImage, 0, 0, width, height);
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;

      const gray = new Uint8Array(width * height);
      for (let i = 0; i < data.length; i += 4) {
        gray[i / 4] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      }

      const output = ctx.createImageData(width, height);
      const outData = output.data;

      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;

          const gx =
            -gray[idx - width - 1] + gray[idx - width + 1] +
            -2 * gray[idx - 1] + 2 * gray[idx + 1] +
            -gray[idx + width - 1] + gray[idx + width + 1];

          const gy =
            -gray[idx - width - 1] - 2 * gray[idx - width] - gray[idx - width + 1] +
            gray[idx + width - 1] + 2 * gray[idx + width] + gray[idx + width + 1];

          const mag = Math.sqrt(gx * gx + gy * gy);
          const pixel = mag > 45 ? 0 : 255;

          const outIdx = idx * 4;
          outData[outIdx] = pixel;
          outData[outIdx + 1] = pixel;
          outData[outIdx + 2] = pixel;
          outData[outIdx + 3] = 255;
        }
      }

      ctx.putImageData(output, 0, 0);
      saveState();
    });

    // اختيار الأدوات والألوان
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.emoji-btn').forEach(e => e.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
      });
    });

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.dataset.color;
        document.getElementById('customColor').value = currentColor;
      });
    });

    document.getElementById('customColor').addEventListener('input', (e) => {
      currentColor = e.target.value;
    });

    document.getElementById('lineWidth').addEventListener('input', (e) => {
      lineWidth = e.target.value;
      document.getElementById('widthValue').innerText = `${lineWidth} px`;
    });

    document.getElementById('fillShape').addEventListener('change', (e) => {
      fillShape = e.target.checked;
    });

    document.querySelectorAll('.emoji-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.emoji-btn').forEach(e => e.classList.remove('active'));
        btn.classList.add('active');
        selectedEmoji = btn.dataset.emoji;
        currentTool = 'emoji';
      });
    });

    // أحداث الكانفاس واللمس
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', drawing);
    canvas.addEventListener('mouseup', endDraw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawing(e); });
    canvas.addEventListener('touchend', endDraw);

    function startDraw(e) {
      isDrawing = true;
      const pos = getPos(e);
      startX = pos.x;
      startY = pos.y;
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (currentTool === 'fill') {
        floodFill(Math.round(startX), Math.round(startY), currentColor);
        saveState();
        isDrawing = false;
      } else if (currentTool === 'emoji') {
        ctx.font = `${lineWidth * 6}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(selectedEmoji, startX, startY);
        saveState();
        isDrawing = false;
      } else {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    }

    function drawing(e) {
      if (!isDrawing) return;
      const pos = getPos(e);

      if (['rectangle', 'circle', 'triangle', 'star', 'line'].includes(currentTool)) {
        ctx.putImageData(snapshot, 0, 0);
      }

      ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
      ctx.fillStyle = currentColor;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'pen') {
        ctx.lineCap = 'square';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'spray') {
        for (let i = 0; i < 20; i++) {
          const offsetX = (Math.random() - 0.5) * lineWidth * 2.5;
          const offsetY = (Math.random() - 0.5) * lineWidth * 2.5;
          ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 1, 1);
        }
      } else if (currentTool === 'line') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'rectangle') {
        if (fillShape) ctx.fillRect(startX, startY, pos.x - startX, pos.y - startY);
        ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
      } else if (currentTool === 'circle') {
        const radius = Math.hypot(pos.x - startX, pos.y - startY);
        ctx.beginPath();
        ctx.arc(startX, startY, radius, 0, Math.PI * 2);
        if (fillShape) ctx.fill();
        ctx.stroke();
      } else if (currentTool === 'triangle') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineTo(startX - (pos.x - startX), pos.y);
        ctx.closePath();
        if (fillShape) ctx.fill();
        ctx.stroke();
      } else if (currentTool === 'star') {
        drawStar(startX, startY, 5, Math.abs(pos.x - startX), Math.abs(pos.x - startX) / 2);
      }
    }

    function endDraw() {
      if (isDrawing) {
        isDrawing = false;
        ctx.beginPath();
        saveState();
      }
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
      let rot = (Math.PI / 2) * 3;
      let x = cx, y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      if (fillShape) ctx.fill();
      ctx.stroke();
    }

    // خوارزمية التعبئة بالدلو (Flood Fill)
    function floodFill(startX, startY, fillColorHex) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const targetColor = getPixel(startX, startY);
      const fillColor = hexToRgb(fillColorHex);

      if (colorMatch(targetColor, fillColor)) return;

      const pixelsToCheck = [startX, startY];
      while (pixelsToCheck.length > 0) {
        const y = pixelsToCheck.pop();
        const x = pixelsToCheck.pop();

        const currentColor = getPixel(x, y);
        if (colorMatch(currentColor, targetColor)) {
          setPixel(x, y, fillColor);

          if (x > 0) pixelsToCheck.push(x - 1, y);
          if (x < width - 1) pixelsToCheck.push(x + 1, y);
          if (y > 0) pixelsToCheck.push(x, y - 1);
          if (y < height - 1) pixelsToCheck.push(x, y + 1);
        }
      }

      ctx.putImageData(imgData, 0, 0);

      function getPixel(x, y) {
        const idx = (y * width + x) * 4;
        return [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
      }

      function setPixel(x, y, color) {
        const idx = (y * width + x) * 4;
        data[idx] = color[0];
        data[idx + 1] = color[1];
        data[idx + 2] = color[2];
        data[idx + 3] = 255;
      }

      function colorMatch(a, b) {
        return Math.abs(a[0] - b[0]) < 35 &&
               Math.abs(a[1] - b[1]) < 35 &&
               Math.abs(a[2] - b[2]) < 35;
      }

      function hexToRgb(hex) {
        const bigint = parseInt(hex.replace('#', ''), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
      }
    }
