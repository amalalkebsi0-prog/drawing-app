<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    :root {
      --bg-main: #131525;
      --panel-bg: #1c1e36;
      --card-bg: #272a48;
      --accent-color: #a78bfa;
      --border-color: #2e3258;
      --text-main: #ffffff;
      --text-sub: #a3a8cc;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      direction: rtl;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      padding: 12px 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap-reverse;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #b892ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: opacity 0.2s;
      text-decoration: none;
    }

    .btn:hover { opacity: 0.9; }

    .btn-save { background: #10b981; }
    .btn-clear { background: #ef4444; }
    .btn-undo { background: #f59e0b; color: #000; }
    .btn-outline { background: #a855f7; }
    .btn-remove-bg { background: #ec4899; }
    .btn-upload { background: #6366f1; }

    .main-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    .canvas-section {
      flex: 1;
      background: var(--panel-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .canvas-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .zoom-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .canvas-container {
      background: #ffffff;
      border-radius: 8px;
      overflow: auto;
      max-height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      background-color: #ffffff;
      cursor: crosshair;
    }

    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--panel-bg);
      padding: 16px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      overflow-y: auto;
    }

    .tool-section {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    .tool-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tool-section h3 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: var(--text-sub);
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .tool-btn:hover {
      background: #343861;
    }

    .tool-btn.active {
      background: #6366f1;
      border-color: #6366f1;
    }

    .btn-magic-eraser {
      grid-column: span 2;
      background: #d946ef;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .sticker-search-input {
      width: 100%;
      padding: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sticker-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
    }

    .sticker-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .site-link-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: none;
      font-weight: 600;
    }

    .site-link-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1e40af);
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="top-actions">
      <button id="btnSave" class="btn btn-save">💾 حفظ اللوحة</button>
      <button id="btnClear" class="btn btn-clear">🗑️ مسح الكل</button>
      <button id="btnUndo" class="btn btn-undo">↩️ تراجع</button>
      <button id="btnOutline" class="btn btn-outline">✨ تفريغ الألوان (أسود وأبيض)</button>
      <button id="btnRemoveBg" class="btn btn-remove-bg">🪄 إزالة الخلفية</button>
      <label for="imageLoader" class="btn btn-upload">📁 رفع صورة جديدة</label>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
    </div>
    <h1>تطبيق الرسم والتلوين الاحترافي 🟣</h1>
  </div>

  <div class="main-layout">
    
    <div class="canvas-section">
      <div class="canvas-header-bar">
        <h3>لوحة الرسم والتلوين:</h3>
        <div class="zoom-controls">
          <span style="font-size:0.8rem; color:var(--text-sub); margin-left:8px;">100%</span>
          <button class="zoom-btn">🎯 إعادة ضبط</button>
          <button class="zoom-btn">🔍- تصغير</button>
          <button class="zoom-btn">🔍+ تكبير</button>
        </div>
      </div>
      <div class="canvas-container">
        <canvas id="paintCanvas" width="800" height="520"></canvas>
      </div>
    </div>

    <aside class="sidebar">
      <div class="tool-section">
        <div class="grid-buttons">
          <button class="tool-btn active">فرشاة 🖌️</button>
          <button class="tool-btn">بخاخ 💨</button>
          <button class="tool-btn">دلو تعبئة 🪣</button>
          <button class="tool-btn">ممحاة عادية 🧹</button>
          <button class="btn-magic-eraser">✨ الممسحة السحرية (تحديد العنصر)</button>
        </div>
      </div>

      <!-- قسم الأزرار المضافة للمواقع المتخصصة بالرسم -->
      <div class="tool-section">
        <h3>🌐 مواقع رسم عالمية متخصصة</h3>
        <div class="grid-buttons">
          <a href="https://www.autodraw.com" target="_blank" class="tool-btn site-link-btn">🤖 AutoDraw</a>
          <a href="https://quickdraw.withgoogle.com" target="_blank" class="tool-btn site-link-btn">⚡ Quick Draw</a>
          <a href="https://sketchpad.app" target="_blank" class="tool-btn site-link-btn">🎨 Sketchpad</a>
          <a href="https://aggie.io" target="_blank" class="tool-btn site-link-btn">👥 Aggie.io (رسم جماعي)</a>
          <a href="https://kleki.com" target="_blank" class="tool-btn site-link-btn" style="grid-column: span 2;">🖌️ Kleki Paint</a>
        </div>
      </div>

      <div class="tool-section">
        <h3>📐 الأشكال الهندسية</h3>
        <div class="grid-buttons">
          <button class="tool-btn">مربع ⬛</button>
          <button class="tool-btn">دائرة ⚪</button>
          <button class="tool-btn">مثلث 🔺</button>
          <button class="tool-btn">نجمة ⭐</button>
        </div>
        <label class="checkbox-container">
          <input type="checkbox"> تعبئة الشكل باللون
        </label>
      </div>

      <div class="tool-section">
        <h3>🐼 مكتبة الملصقات الشاملة (CLIPART)</h3>
        <input type="text" class="sticker-search-input" placeholder="🔍 ابحث (باندا، شمس، قطة، طائرة، بيتزا...)...">
        <div class="sticker-grid">
          <div class="sticker-card"><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="%23f59e0b"/></svg>' alt="شمس"></div>
          <div class="sticker-card"><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="%23fb923c"/></svg>' alt="قطة"></div>
          <div class="sticker-card"><img src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="%23fff" stroke="%23000" stroke-width="4"/></svg>' alt="باندا"></div>
        </div>
      </div>
    </aside>

  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  </script>
</body>
</html>
