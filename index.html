<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو الرسم والتلوين</title>
    <style>
        body { background: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .toolbar { background: #fff; padding: 10px; border-radius: 8px; margin: 10px; display: flex; gap: 10px; align-items: center; border: 1px solid #ccc; }
        .canvases { display: flex; gap: 20px; }
        canvas { border: 2px solid #333; background: #fff; cursor: crosshair; }
        .color-btn { width: 25px; height: 25px; border: 1px solid #000; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="upload" accept="image/*">
        <label>الحجم: <input type="range" id="brushSize" min="1" max="20" value="5"></label>
        <div id="palette"></div>
        <button onclick="currentTool='brush'">فرشاة</button>
        <button onclick="currentTool='eraser'">ممحاة</button>
        <button onclick="clearAll()">مسح</button>
    </div>

    <div class="canvases">
        <div><p>المرجع:</p><canvas id="ref" width="400" height="300"></canvas></div>
        <div><p>التلوين:</p><canvas id="main" width="400" height="300"></canvas></div>
    </div>

<script>
    const refCtx = document.getElementById('ref').getContext('2d');
    const mainCtx = document.getElementById('main').getContext('2d');
    const mainCanvas = document.getElementById('main');
    let currentTool = 'brush';
    let drawing = false;

    // تهيئة الألوان
    const colors = ['#000', '#f00', '#0f0', '#00f', '#ff0', '#f0f', '#ffa500'];
    colors.forEach(c => {
        let b = document.createElement('div');
        b.className = 'color-btn';
        b.style.background = c;
        b.onclick = () => { color = c; currentTool = 'brush'; };
        document.getElementById('palette').appendChild(b);
    });
    let color = '#000';

    // رفع ومعالجة الصورة
    document.getElementById('upload').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // رسم المرجع
                refCtx.drawImage(img, 0, 0, 400, 300);
                // رسم التلوين (سكتش بسيط بدون فلتر معقد لتجنب الأخطاء)
                mainCtx.drawImage(img, 0, 0, 400, 300);
                mainCtx.globalCompositeOperation = 'source-atop';
                mainCtx.fillStyle = 'rgba(255,255,255,0.8)'; // تفتيح الصورة لتصبح كالسكتش
                mainCtx.fillRect(0,0,400,300);
                mainCtx.globalCompositeOperation = 'source-over';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // الرسم
    mainCanvas.onmousedown = () => drawing = true;
    mainCanvas.onmouseup = () => { drawing = false; mainCtx.beginPath(); };
    mainCanvas.onmousemove = function(e) {
        if (!drawing) return;
        const rect = mainCanvas.getBoundingClientRect();
        mainCtx.lineWidth = document.getElementById('brushSize').value;
        mainCtx.strokeStyle = (currentTool === 'eraser') ? '#fff' : color;
        mainCtx.lineCap = 'round';
        mainCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        mainCtx.stroke();
        mainCtx.beginPath();
        mainCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    };

    function clearAll() { mainCtx.clearRect(0,0,400,300); }
</script>
</body>
</html>
