<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو التلوين الاحترافي</title>
    <style>
        body { background: #1e1e26; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 10px; }
        .toolbar { background: #2d2d3a; padding: 10px; border-radius: 8px; display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .canvas-area { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { background: white; border-radius: 8px; cursor: crosshair; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .sticker-box { display: flex; gap: 5px; background: #444; padding: 5px; border-radius: 5px; }
        .sticker { font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="toolbar">
    <input type="file" id="upload" accept="image/*">
    <button onclick="convertToSketch()">🎨 تحويل لسكتش</button>
    <button onclick="undoAction()">↩️ تراجع</button>
    <button onclick="clearColorsOnly()" style="background: #eab308;">🧼 تفريغ ألوان</button>
    <button onclick="clearAll()" style="background: #ef4444;">🔄 مسح الكل</button>
    
    <div class="sticker-box">
        <span class="sticker" onclick="addSticker('⭐')">⭐</span>
        <span class="sticker" onclick="addSticker('❤️')">❤️</span>
        <span class="sticker" onclick="addSticker('😊')">😊</span>
        <span class="sticker" onclick="addSticker('🎈')">🎈</span>
    </div>
</div>

<div class="canvas-area">
    <div><p>المرجع:</p><canvas id="ref" width="300" height="225"></canvas></div>
    <div><p>لوحة الرسم (اضغط للرسم أو إضافة ملصق):</p><canvas id="main" width="800" height="600"></canvas></div>
</div>

<script>
    const refCtx = document.getElementById('ref').getContext('2d');
    const mainCanvas = document.getElementById('main');
    const ctx = mainCanvas.getContext('2d');
    let originalImageObj = null;
    let undoStack = [];

    // وظيفة التحويل لسكتش (الأداة الاحترافية)
    function convertToSketch() {
        if (!originalImageObj) return;
        saveState();
        ctx.drawImage(originalImageObj, 0, 0, 800, 600);
        let imgData = ctx.getImageData(0, 0, 800, 600);
        let data = imgData.data;
        let gray = new Uint8ClampedArray(800 * 600);
        for (let i = 0; i < 800 * 600; i++) gray[i] = (data[i*4] + data[i*4+1] + data[i*4+2]) / 3;

        let output = ctx.createImageData(800, 600);
        for (let y = 1; y < 599; y++) {
            for (let x = 1; x < 799; x++) {
                let idx = y * 800 + x;
                let gx = -gray[idx - 801] + gray[idx - 799] - 2 * gray[idx - 1] + 2 * gray[idx + 1] - gray[idx + 799] + gray[idx + 801];
                let gy = -gray[idx - 801] - 2 * gray[idx - 800] - gray[idx - 799] + gray[idx + 799] + 2 * gray[idx + 800] + gray[idx + 801];
                let val = Math.sqrt(gx * gx + gy * gy) > 30 ? 0 : 255;
                let i4 = idx * 4;
                output.data[i4] = output.data[i4+1] = output.data[i4+2] = val;
                output.data[i4+3] = 255;
            }
        }
        ctx.putImageData(output, 0, 0);
    }

    // إضافة ملصقات
    function addSticker(emoji) {
        ctx.font = "50px Arial";
        ctx.fillText(emoji, 100, 100);
    }

    // رفع الصورة
    document.getElementById('upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                refCtx.clearRect(0,0,300,225); refCtx.drawImage(img, 0, 0, 300, 225);
                ctx.clearRect(0,0,800,600); ctx.drawImage(img, 0, 0, 800, 600);
                originalImageObj = img;
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function saveState() { undoStack.push(ctx.getImageData(0,0,800,600)); }
    function undoAction() { if(undoStack.length>0) ctx.putImageData(undoStack.pop(), 0, 0); }
    function clearColorsOnly() { if(originalImageObj) ctx.drawImage(originalImageObj, 0, 0, 800, 600); }
    function clearAll() { ctx.clearRect(0,0,800,600); }

    // الرسم
    let drawing = false;
    mainCanvas.onmousedown = () => { saveState(); drawing = true; };
    mainCanvas.onmousemove = (e) => {
        if(!drawing) return;
        const rect = mainCanvas.getBoundingClientRect();
        ctx.fillStyle = "#000"; // القلم
        ctx.fillRect(e.clientX - rect.left, e.clientY - rect.top, 5, 5);
    };
    mainCanvas.onmouseup = () => drawing = false;
</script>
</body>
</html>
