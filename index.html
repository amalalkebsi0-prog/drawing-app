<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    :root {
      --bg-main: #131525;
      --panel-bg: #1c1e36;
      --card-bg: #272a48;
      --accent-color: #a78bfa;
      --border-color: #2e3258;
      --text-main: #ffffff;
      --text-sub: #a3a8cc;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; direction: rtl; }

    .app-header { display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 12px 24px; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid var(--border-color); flex-wrap: wrap-reverse; gap: 12px; }
    .app-header h1 { font-size: 1.4rem; font-weight: 700; color: #b892ff; display: flex; align-items: center; gap: 8px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; transition: opacity 0.2s; text-decoration: none; }
    .btn:hover { opacity: 0.9; }
    .btn-save { background: #10b981; }
    .btn-clear { background: #ef4444; }
    .btn-undo { background: #f59e0b; color: #000; }
    .btn-outline { background: #a855f7; }
    .btn-remove-bg { background: #ec4899; }
    .btn-upload { background: #6366f1; }

    .main-layout { display: flex; flex-direction: row; gap: 20px; align-items: flex-start; }
    .canvas-section { flex: 1; background: var(--panel-bg); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; }
    .canvas-header-bar { display: flex; justify-content: space-between; align-items: center; }
    .work-area { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .canvas-container { background: #ffffff; border-radius: 8px; overflow: auto; max-height: 580px; display: flex; justify-content: center; align-items: center; flex: 1; min-width: 400px; position: relative; }
    canvas { display: block; background-color: #ffffff; cursor: crosshair; }

    /* شاشة المعاينة الثابتة */
    .preview-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 14px; width: 260px; min-width: 260px; display: flex; flex-direction: column; gap: 12px; }
    .preview-panel h4 { font-size: 0.9rem; color: var(--text-sub); }
    .preview-screen { width: 100%; height: 250px; background: #0f111a; border: 2px dashed var(--border-color); border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
    .preview-screen img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
    .placeholder-text { color: var(--text-sub); font-size: 0.8rem; text-align: center; position: absolute; }

    .sidebar { width: 320px; min-width: 320px; background: var(--panel-bg); padding: 16px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--border-color); max-height: 85vh; overflow-y: auto; }
    .tool-section { border-bottom: 1px solid var(--border-color); padding-bottom: 14px; }
    .tool-section:last-child { border-bottom: none; padding-bottom: 0; }
    .tool-section h3 { font-size: 0.9rem; margin-bottom: 10px; color: var(--text-sub); }

    .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .tool-btn { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .tool-btn.active { background: #6366f1; border-color: #6366f1; font-weight: bold;}

    .btn-magic-eraser { grid-column: span 2; background: #d946ef; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-magic-eraser.active { background: #a21caf; border: 2px solid white; }

    .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.8rem; color: var(--text-sub); }
    .sticker-search-input { width: 100%; padding: 8px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; margin-bottom: 8px; font-size: 0.8rem; }
    .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sticker-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 60px; }
    .sticker-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .site-link-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #ffffff; border: none; font-weight: 600; text-decoration: none;}
  </style>
</head>
<body>

  <div class="app-header">
    <div class="top-actions">
      <button id="btnSave" class="btn btn-save">💾 حفظ اللوحة</button>
      <button id="btnClear" class="btn btn-clear">🗑️ مسح الكل</button>
      <button id="btnUndo" class="btn btn-undo">↩️ تراجع</button>
      <button id="btnOutline" class="btn btn-outline">✨ تفريغ الألوان</button>
      <button id="btnRemoveBg" class="btn btn-remove-bg">🪄 إزالة الخلفية</button>
      <label for="imageLoader" class="btn btn-upload">📁 رفع صورة</label>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
    </div>
    <h1>تطبيق الرسم الاحترافي 🟣</h1>
  </div>

  <div class="main-layout">
    <div class="canvas-section">
      <div class="canvas-header-bar">
        <h3>لوحة الرسم:</h3>
        <span style="font-size:0.8rem; color:var(--text-sub);">اللون: <input type="color" id="colorPicker" value="#000000"> | الحجم: <input type="range" id="sizeSlider" min="1" max="50" value="5"></span>
      </div>
      <div class="work-area">
        <div class="canvas-container">
          <canvas id="paintCanvas" width="800" height="520"></canvas>
        </div>
        <div class="preview-panel">
          <h4>🖼️ معاينة المرفق (ثابت)</h4>
          <div class="preview-screen">
            <span class="placeholder-text" id="placeholderText">لا توجد صورة</span>
            <img id="previewImg" alt="المعاينة">
          </div>
          <button class="btn btn-upload" id="btnPlaceOnCanvas" style="width:100%; justify-content:center; display:none; margin-top:10px;">📥 إدراج باللوحة</button>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="tool-section">
        <div class="grid-buttons">
          <button class="tool-btn active" id="btnBrush">فرشاة 🖌️</button>
          <button class="tool-btn" id="btnEraser">ممحاة عادية 🧹</button>
          <button class="btn-magic-eraser" id="btnMagicEraser">✨ الممسحة السحرية (حذف لون)</button>
        </div>
      </div>
      <div class="tool-section">
        <h3>📐 أشكال</h3>
        <div class="grid-buttons">
          <button class="tool-btn" id="btnRect">مربع ⬛</button>
          <button class="tool-btn" id="btnCircle">دائرة ⚪</button>
        </div>
      </div>
      <div class="tool-section">
        <h3>🌐 مواقع</h3>
        <div class="grid-buttons">
          <a href="https://sketchpad.app" target="_blank" class="tool-btn site-link-btn">🎨 Sketchpad</a>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const colorPicker = document.getElementById('colorPicker');
    const sizeSlider = document.getElementById('sizeSlider');

    // الإعدادات الافتراضية
    let currentTool = 'brush';
    let isDrawing = false;
    let startX, startY;
    let undoHistory = [];
    let currentColor = '#000000';
    let currentSize = 5;

    // تهيئة اللوحة
    function initCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState(); // حفظ الحالة الأولى (البيضاء)
    }

    // حفظ الحالة للتراجع
    function saveState() {
      if (undoHistory.length >= 20) undoHistory.shift(); // حد أقصى 20 خطوة
      undoHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    initCanvas();

    // --- ربط أزرار الأدوات ---
    const tools = {
      'btnBrush': 'brush',
      'btnEraser': 'eraser',
      'btnMagicEraser': 'magicEraser',
      'btnRect': 'rect',
      'btnCircle': 'circle'
    };

    Object.keys(tools).forEach(id => {
      document.getElementById(id).addEventListener('click', function() {
        // إزالة النشاط عن الجميع
        document.querySelectorAll('.tool-btn, .btn-magic-eraser').forEach(b => b.classList.remove('active'));
        // إضافة النشاط للزر المضغوط
        this.classList.add('active');
        currentTool = tools[id];
      });
    });

    // تغيير اللون والحجم
    colorPicker.addEventListener('input', (e) => currentColor = e.target.value);
    sizeSlider.addEventListener('input', (e) => currentSize = e.target.value);

    // --- منطق الرسم الأساسي ---
    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getMousePos(e);
      startX = pos.x;
      startY = pos.y;
      
      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      } else if (currentTool === 'magicEraser') {
        saveState(); // حفظ الحالة قبل الحذف
        magicErase(startX, startY);
        isDrawing = false; // لا نحتاج للسحب
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getMousePos(e);

      ctx.lineWidth = currentSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'brush') {
        ctx.strokeStyle = currentColor;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'eraser') {
        ctx.strokeStyle = '#ffffff'; // الممحاة العادية ترسم باللون الأبيض
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else if (currentTool === 'rect' || currentTool === 'circle') {
        // رسم الأشكال يحتاج إلى إعادة رسم الحالة السابقة لتجنب التكرار أثناء السحب
        ctx.putImageData(undoHistory[undoHistory.length - 1], 0, 0);
        ctx.strokeStyle = currentColor;
        ctx.fillStyle = currentColor;
        ctx.beginPath();
        if (currentTool === 'rect') {
          ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
        } else {
          let radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
          ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
          ctx.stroke();
        }
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        saveState(); // حفظ الحالة بعد الانتهاء من الرسم
      }
    });

    // --- منطق الممسحة السحرية (حذف لون) ---
    function magicErase(x, y) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const targetIdx = (Math.floor(y) * canvas.width + Math.floor(x)) * 4;
      
      // اللون المستهدف (الذي ضغطت عليه)
      const targetR = data[targetIdx];
      const targetG = data[targetIdx + 1];
      const targetB = data[targetIdx + 2];
      
      // التسامح (Tolerance) - مدى قرابة الألوان من بعضها لتحذف
      const tolerance = 30;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        // إذا كان اللون قريباً من اللون المستهدف، اجعله شفافاً (أو أبيض)
        if (Math.abs(r - targetR) < tolerance && Math.abs(g - targetG) < tolerance && Math.abs(b - targetB) < tolerance) {
          data[i] = 255;     // R
          data[i + 1] = 255; // G
          data[i + 2] = 255; // B
          // data[i + 3] = 0; // جعلها شفافة تماماً (تحتاج خلفية شفافة للكانفاس)
          // بما أن خلفيتنا بيضاء، سنحول اللون المحذوف للأبيض.
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // --- الأزرار العلوية ---
    // 1. التراجع
    document.getElementById('btnUndo').onclick = function() {
      if (undoHistory.length > 1) {
        undoHistory.pop(); // إزالة الحالة الحالية
        ctx.putImageData(undoHistory[undoHistory.length - 1], 0, 0); // رسم الحالة السابقة
      }
    };

    // 2. مسح الكل
    document.getElementById('btnClear').onclick = function() {
      initCanvas();
    };

    // 3. حفظ اللوحة
    document.getElementById('btnSave').onclick = function() {
      const link = document.createElement('a');
      link.download = 'painting.png';
      link.href = canvas.toDataURL();
      link.click();
    };

    // 4. تفريغ الألوان (رمادي)
    document.getElementById('btnOutline').onclick = function() {
      saveState();
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        data[i] = avg;     // R
        data[i + 1] = avg; // G
        data[i + 2] = avg; // B
      }
      ctx.putImageData(imgData, 0, 0);
    };

    // 5. إزالة الخلفية (تحويل كل ما هو قريب من الأبيض إلى أبيض ناصع أو شفاف)
    document.getElementById('btnRemoveBg').onclick = function() {
      saveState();
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const tolerance = 20; // التسامح مع اللون الأبيض
      for (let i = 0; i < data.length; i += 4) {
        if (data[i] > 255 - tolerance && data[i + 1] > 255 - tolerance && data[i + 2] > 255 - tolerance) {
          data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; // تحويله لأبيض مثالي
          // data[i+3] = 0; // أو جعله شفافاً
        }
      }
      ctx.putImageData(imgData, 0, 0);
    };

    // --- معالجة الصور والمرفقات ---
    const imageLoader = document.getElementById('imageLoader');
    const previewImg = document.getElementById('previewImg');
    const placeholderText = document.getElementById('placeholderText');
    const btnPlaceOnCanvas = document.getElementById('btnPlaceOnCanvas');
    let loadedImageObj = null;

    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          loadedImageObj = new Image();
          loadedImageObj.onload = function() {
            previewImg.src = event.target.result;
            previewImg.style.display = 'block';
            placeholderText.style.display = 'none';
            btnPlaceOnCanvas.style.display = 'flex';
          };
          loadedImageObj.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    btnPlaceOnCanvas.onclick = function() {
      if (loadedImageObj) {
        saveState();
        // رسم الصورة في المنتصف وتصغيرها لتناسب الكانفاس
        const scale = Math.min(canvas.width / loadedImageObj.width, canvas.height / loadedImageObj.height, 1);
        const w = loadedImageObj.width * scale;
        const h = loadedImageObj.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(loadedImageObj, x, y, w, h);
      }
    };
  </script>
</body>
</html>
