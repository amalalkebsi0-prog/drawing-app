<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الرسم والتلوين الاحترافي</title>
  <style>
    :root {
      --bg-main: #131525;
      --panel-bg: #1c1e36;
      --card-bg: #272a48;
      --accent-color: #a78bfa;
      --border-color: #2e3258;
      --text-main: #ffffff;
      --text-sub: #a3a8cc;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      direction: rtl;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      padding: 12px 24px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap-reverse;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #b892ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      transition: opacity 0.2s;
      text-decoration: none;
    }

    .btn:hover { opacity: 0.9; }

    .btn-save { background: #10b981; }
    .btn-clear { background: #ef4444; }
    .btn-undo { background: #f59e0b; color: #000; }
    .btn-outline { background: #a855f7; }
    .btn-remove-bg { background: #ec4899; }
    .btn-upload { background: #6366f1; }

    .main-layout {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    .canvas-section {
      flex: 1;
      background: var(--panel-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .canvas-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zoom-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .canvas-container {
      background: #ffffff;
      border-radius: 8px;
      overflow: auto;
      max-height: 580px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      min-width: 400px;
    }

    canvas {
      display: block;
      background-color: #ffffff;
      cursor: crosshair;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      width: 260px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .preview-panel h4 {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .preview-screen {
      width: 100%;
      height: 250px;
      background: #0f111a;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      display: flex;
      justify(center);
      align-items: center;
      overflow: hidden;
    }

    .preview-screen img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .placeholder-text {
      color: var(--text-sub);
      font-size: 0.8rem;
      text-align: center;
    }

    .sidebar {
      width: 320px;
      min-width: 320px;
      background: var(--panel-bg);
      padding: 16px;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border-color);
      max-height: 85vh;
      overflow-y: auto;
    }

    .tool-section {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    .tool-section h3 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: var(--text-sub);
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tool-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
      transition: background 0.2s;
    }

    .tool-btn.active { background: #6366f1; border-color: #6366f1; }

    .tool-btn-magic {
      grid-column: span 2;
      background: #272a48;
      border: 1px solid #d946ef;
      color: #d946ef;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .tool-btn-magic.active {
      background: #d946ef;
      color: white;
    }

    .site-link-btn {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      border: none;
      font-weight: 600;
      text-decoration: none;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="top-actions">
      <button id="btnSave" class="btn btn-save">💾 حفظ اللوحة</button>
      <button id="btnClear" class="btn btn-clear">🗑️ مسح الكل</button>
      <button id="btnUndo" class="btn btn-undo">↩️ تراجع</button>
      <button id="btnOutline" class="btn btn-outline">✨ تفريغ الألوان (أسود وأبيض)</button>
      <button id="btnRemoveBg" class="btn btn-remove-bg">🪄 إزالة الخلفية</button>
      
      <button type="button" id="btnUploadTrigger" class="btn btn-upload">📁 رفع صورة جديدة</button>
      <input type="file" id="imageLoader" accept="image/*" style="display:none;">
    </div>
    <h1>تطبيق الرسم والتلوين الاحترافي 🟣</h1>
  </div>

  <div class="main-layout">
    
    <div class="canvas-section">
      <div class="canvas-header-bar">
        <h3>لوحة الرسم والتلوين:</h3>
        <div class="zoom-controls">
          <span style="font-size:0.8rem; color:var(--text-sub); margin-left:8px;">100%</span>
        </div>
      </div>

      <div class="work-area">
        <div class="canvas-container">
          <canvas id="paintCanvas" width="800" height="520"></canvas>
        </div>

        <div class="preview-panel">
          <h4>🖼️ الصورة المرفوعة (مرجع ثابت)</h4>
          <div class="preview-screen">
            <span class="placeholder-text" id="placeholderText">لا توجد صورة مرفوعة حالياً</span>
            <img id="previewImg" style="display:none;" alt="مرجع الصورة المرفوعة">
          </div>
          <button type="button" class="btn btn-upload" id="btnPlaceOnCanvas" style="width:100%; justify-content:center; display:none;">📥 إدراج داخل اللوحة</button>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="tool-section">
        <div class="grid-buttons">
          <button class="tool-btn tool-main active" data-tool="brush">فرشاة 🖌️</button>
          <button class="tool-btn tool-main" data-tool="spray">بخاخ 💨</button>
          <button class="tool-btn tool-main" data-tool="fill">دلو تعبئة 🪣</button>
          <button class="tool-btn tool-main" data-tool="eraser">ممحاة عادية 🧹</button>
          <button class="tool-btn tool-main tool-btn-magic" data-tool="magicEraser">✨ الممسحة السحرية (تحديد العنصر)</button>
        </div>
      </div>

      <div class="tool-section">
        <h3>🌐 مواقع رسم عالمية متخصصة</h3>
        <div class="grid-buttons">
          <a href="https://www.autodraw.com" target="_blank" class="tool-btn site-link-btn">🤖 AutoDraw</a>
          <a href="https://kleki.com" target="_blank" class="tool-btn site-link-btn">🖌️ Kleki Paint</a>
        </div>
      </div>
    </aside>

  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let undoHistory = [];
    let isDrawing = false;
    let currentTool = 'brush'; // الأداة الافتراضية

    function initCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function saveState() {
      if (undoHistory.length >= 15) undoHistory.shift();
      undoHistory.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    initCanvas();

    // ربط اختيار الأدوات
    document.querySelectorAll('.tool-main').forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll('.tool-main').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentTool = this.dataset.tool;
      };
    });

    // فعاليات الرسم والمسح على الكانفاس
    canvas.onmousedown = (e) => {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
      
      // لتفعيل دلو التعبئة أو الممسحة السحرية عند النقر
      if (currentTool === 'fill' || currentTool === 'magicEraser') {
        handleCanvasClick(e.offsetX, e.offsetY);
      }
    };

    canvas.onmousemove = (e) => {
      if (!isDrawing) return;

      if (currentTool === 'brush') {
        drawLines(e.offsetX, e.offsetY, '#000000', 3);
      } else if (currentTool === 'eraser') {
        drawLines(e.offsetX, e.offsetY, '#ffffff', 15); // الممحاة تمسح باللون الأبيض
      }
    };

    canvas.onmouseup = () => {
      if (isDrawing) {
        isDrawing = false;
        if (currentTool !== 'fill' && currentTool !== 'magicEraser') saveState();
      }
    };

    canvas.onmouseleave = () => isDrawing = false;

    function drawLines(x, y, color, size) {
      ctx.strokeStyle = color;
      ctx.lineWidth = size;
      ctx.lineCap = 'round';
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    // معالجة أدوات النقر (دلو التعبئة والممسحة السحرية)
    function handleCanvasClick(startX, startY) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const targetIdx = (Math.floor(startY) * canvas.width + Math.floor(startX)) * 4;
      const targetR = data[targetIdx], targetG = data[targetIdx+1], targetB = data[targetIdx+2];

      let fillColor = [0, 0, 0]; // لون دلو التعبئة الافتراضي

      if (currentTool === 'magicEraser') {
        fillColor = [255, 255, 255]; // الممسحة السحرية تملأ بالأبيض للمسح
      }

      // خوارزمية Flood Fill بسيطة
      floodFill(data, Math.floor(startX), Math.floor(startY), targetR, targetG, targetB, fillColor);
      
      ctx.putImageData(imgData, 0, 0);
      saveState();
      isDrawing = false; // لمنع الرسم بعد النقر
    }

    function floodFill(data, startX, startY, targetR, targetG, targetB, fillColor) {
      const pixelsToCheck = [[startX, startY]];
      const width = canvas.width, height = canvas.height;
      const visited = new Uint8Array(width * height);

      while (pixelsToCheck.length > 0) {
        const [x, y] = pixelsToCheck.pop();
        const idx = y * width + x;

        if (x < 0 || x >= width || y < 0 || y >= height || visited[idx]) continue;
        visited[idx] = 1;

        const pIdx = idx * 4;
        if (Math.abs(data[pIdx] - targetR) < 20 && Math.abs(data[pIdx+1] - targetG) < 20 && Math.abs(data[pIdx+2] - targetB) < 20) {
          data[pIdx] = fillColor[0]; data[pIdx+1] = fillColor[1]; data[pIdx+2] = fillColor[2];
          pixelsToCheck.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
    }

    // فعاليات الأزرار العلوية (مسح، تراجع، حفظ...)
    document.getElementById('btnClear').onclick = initCanvas;

    document.getElementById('btnUndo').onclick = function() {
      if (undoHistory.length > 1) {
        undoHistory.pop();
        ctx.putImageData(undoHistory[undoHistory.length - 1], 0, 0);
      }
    };

    document.getElementById('btnSave').onclick = function() {
      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = canvas.toDataURL();
      link.click();
    };

    // معالجة رفع الملف (المعاينة الثابتة)
    const btnUploadTrigger = document.getElementById('btnUploadTrigger');
    const imageLoader = document.getElementById('imageLoader');
    const previewImg = document.getElementById('previewImg');
    const placeholderText = document.getElementById('placeholderText');
    btnUploadTrigger.onclick = () => imageLoader.click();

    imageLoader.onchange = function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          placeholderText.style.display = 'none';
        };
        reader.readAsDataURL(file);
      }
    };
  </script>
</body>
</html>
