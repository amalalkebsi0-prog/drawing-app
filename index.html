<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استوديو التلوين الاحترافي</title>
    <style>
        :root { --bg: #1e1e26; --panel: #2d2d3a; --accent: #6366f1; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        
        .toolbar { background: var(--panel); padding: 15px 25px; border-radius: 12px; display: flex; gap: 20px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; flex-wrap: wrap; }
        
        .canvas-area { display: flex; gap: 40px; }
        .canvas-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        canvas { background: white; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); cursor: crosshair; }
        
        button, select, input { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; background: #3f3f46; color: white; }
        button:hover { background: var(--accent); }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid white; cursor: pointer; transition: transform 0.2s; }
        .color-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

<div class="toolbar">
    <label style="background:var(--accent); padding:8px 15px; border-radius:6px; cursor:pointer;">
        رفع صورة جديدة 🖼️<input type="file" id="upload" accept="image/*" style="display:none;">
    </label>
    <select id="tool">
        <option value="pencil">✏️ قلم</option>
        <option value="brush">🖌️ فرشاة</option>
        <option value="fill">🪣 دلو التعبئة</option>
        <option value="eraser">🧹 ممحاة</option>
    </select>
    <input type="range" id="size" min="1" max="50" value="5" title="حجم الأداة">
    <div id="palette" style="display:flex; gap:8px;"></div>
    <button onclick="clearAll()">🔄 مسح الكل</button>
</div>

<div class="canvas-area">
    <div class="canvas-card">
        <p>المرجع الملون:</p>
        <canvas id="ref" width="300" height="225"></canvas>
    </div>
    <div class="canvas-card">
        <p>لوحة الرسم والتلوين:</p>
        <canvas id="main" width="800" height="600"></canvas>
    </div>
</div>

<script>
    const refCtx = document.getElementById('ref').getContext('2d');
    const ctx = document.getElementById('main').getContext('2d');
    const mainCanvas = document.getElementById('main');
    let color = '#000000', drawing = false;

    // تهيئة الألوان
    ['#000', '#f43f5e', '#22c55e', '#3b82f6', '#eab308', '#d946ef', '#06b6d4', '#f97316'].forEach(c => {
        let b = document.createElement('div');
        b.className = 'color-btn'; b.style.background = c;
        b.onclick = () => color = c;
        document.getElementById('palette').appendChild(b);
    });

    document.getElementById('upload').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                refCtx.clearRect(0,0,300,225);
                ctx.clearRect(0,0,800,600);
                refCtx.drawImage(img, 0, 0, 300, 225);
                ctx.drawImage(img, 0, 0, 800, 600);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    mainCanvas.onmousedown = (e) => {
        const {x, y} = getPos(e);
        if(document.getElementById('tool').value === 'fill') {
            floodFill(x, y, hexToRgb(color));
        } else {
            drawing = true;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
    };

    mainCanvas.onmousemove = (e) => {
        if(!drawing) return;
        const {x, y} = getPos(e);
        const tool = document.getElementById('tool').value;
        ctx.lineWidth = document.getElementById('size').value;
        ctx.strokeStyle = (tool === 'eraser') ? '#fff' : color;
        ctx.lineCap = (tool === 'brush') ? 'round' : 'square';
        ctx.lineTo(x, y);
        ctx.stroke();
    };

    mainCanvas.onmouseup = () => { drawing = false; ctx.beginPath(); };

    function getPos(e) {
        const rect = mainCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function floodFill(startX, startY, fillColor) {
        const imgData = ctx.getImageData(0, 0, 800, 600);
        const data = imgData.data;
        const startPos = (Math.floor(startY) * 800 + Math.floor(startX)) * 4;
        const [r, g, b] = [data[startPos], data[startPos+1], data[startPos+2]];
        
        if(r === fillColor.r && g === fillColor.g && b === fillColor.b) return;
        
        let stack = [[Math.floor(startX), Math.floor(startY)]];
        while(stack.length) {
            let [x, y] = stack.pop();
            let p = (y * 800 + x) * 4;
            if(x>=0 && x<800 && y>=0 && y<600 && data[p]===r && data[p+1]===g && data[p+2]===b) {
                [data[p], data[p+1], data[p+2], data[p+3]] = [fillColor.r, fillColor.g, fillColor.b, 255];
                stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function hexToRgb(hex) {
        return {r:parseInt(hex.slice(1,3), 16), g:parseInt(hex.slice(3,5), 16), b:parseInt(hex.slice(5,7), 16)};
    }

    function clearAll() { if(confirm("مسح اللوحة؟")) ctx.clearRect(0,0,800,600); }
</script>
</body>
</html>
