<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الرسم والتلوين التفاعلي</title>
    <style>
        :root {
            --bg-primary: #121216;
            --bg-secondary: #1a1a22;
            --panel: #242430;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #333342;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* تخطيط الصفحة: القائمة على اليسار ومساحة العمل بجانبها */
        .main-layout {
            display: flex;
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* القائمة الجانبية على اليسار */
        .sidebar {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-color: var(--panel);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .tool-group span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        label.upload-btn {
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: white;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
            display: block;
        }
        label.upload-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        select, input[type="range"] {
            background: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        /* صندوق الملصقات التفاعلية */
        .sticker-box {
            display: flex;
            gap: 10px;
            justify-content: space-around;
            background-color: var(--panel);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .sticker-btn {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
        }
        .sticker-btn:hover { transform: scale(1.3); }

        .color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background-color: var(--panel);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .color-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-circle:hover { transform: scale(1.2); }
        .color-circle.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .btn {
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-undo { background-color: #d97706; }
        .btn-clear-colors { background-color: #0d9488; }
        .btn-clear-all { background-color: #dc2626; }

        /* منطقة اللوحات على اليمين */
        .workspace {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .canvas-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .canvas-container {
            position: relative;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* الملصقات القابلة للتحريك والتكبير */
        .draggable-sticker {
            position: absolute;
            font-size: 35px;
            cursor: grab;
            user-select: none;
            transform: translate(-50%, -50%);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .draggable-sticker:active { cursor: grabbing; }
    </style>
</head>
<body>

    <h1>🎨 استوديو الرسم والتلوين التفاعلي</h1>

    <div class="main-layout">
        <!-- القائمة الجانبية على اليسار -->
        <div class="sidebar">
            <label class="upload-btn">
                📂 رفع صورة جديدة
                <input type="file" id="uploadInput" accept="image/*" style="display: none;">
            </label>

            <div class="tool-group">
                <span>أداة الرسم:</span>
                <select id="toolSelect">
                    <option value="brush">🖌️ فرشاة</option>
                    <option value="pencil">✏️ قلم دقيق</option>
                    <option value="eraser">🧹 ممحاة</option>
                </select>
            </div>

            <div class="tool-group">
                <span>حجم الفرشاة:</span>
                <input type="range" id="brushSize" min="1" max="30" value="5">
            </div>

            <div class="tool-group">
                <span>الملصقات (انقر للإضافة):</span>
                <div class="sticker-box">
                    <button class="sticker-btn" onclick="spawnSticker('⭐')">⭐</button>
                    <button class="sticker-btn" onclick="spawnSticker('💖')">💖</button>
                    <button class="sticker-btn" onclick="spawnSticker('🎨')">🎨</button>
                    <button class="sticker-btn" onclick="spawnSticker('👑')">👑</button>
                </div>
            </div>

            <div class="tool-group">
                <span>لوحة الألوان:</span>
                <div class="color-palette" id="colorPalette"></div>
            </div>

            <button class="btn btn-undo" onclick="undoAction()">↩️ تراجع عن الخطوة</button>
            <button class="btn btn-clear-colors" onclick="clearColorsOnly()">🧼 تفريغ الألوان</button>
            <button class="btn btn-clear-all" onclick="clearAll()">🔄 مسح اللوحة بالكامل</button>
        </div>

        <!-- مساحة اللوحات على اليمين -->
        <div class="workspace">
            <div class="canvas-card">
                <h3>المرجع (الصورة الأصلية)</h3>
                <div class="canvas-container">
                    <canvas id="refCanvas" width="280" height="210"></canvas>
                </div>
            </div>

            <div class="canvas-card">
                <h3>لوحة التلوين والرسام</h3>
                <div class="canvas-container" id="mainContainer">
                    <canvas id="mainCanvas" width="750" height="550"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const refCanvas = document.getElementById('refCanvas');
        const refCtx = refCanvas.getContext('2d');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const mainContainer = document.getElementById('mainContainer');

        let currentColor = '#000000';
        let drawing = false;
        let originalImageObj = null;
        let undoStack = [];

        const colors = ['#000000', '#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899', '#ffffff'];
        const paletteContainer = document.getElementById('colorPalette');

        colors.forEach((c, index) => {
            const circle = document.createElement('div');
            circle.className = 'color-circle' + (index === 0 ? ' active' : '');
            circle.style.backgroundColor = c;
            circle.onclick = () => {
                document.querySelectorAll('.color-circle').forEach(el => el.classList.remove('active'));
                circle.classList.add('active');
                currentColor = c;
            };
            paletteContainer.appendChild(circle);
        });

        function saveState() {
            undoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
            if (undoStack.length > 30) undoStack.shift();
        }

        function undoAction() {
            if (undoStack.length > 1) {
                undoStack.pop();
                ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
            } else {
                alert("لا توجد خطوات تراجع سابقة!");
            }
        }

        function spawnSticker(emoji) {
            const sticker = document.createElement('div');
            sticker.className = 'draggable-sticker';
            sticker.innerText = emoji;
            sticker.style.left = '50%';
            sticker.style.top = '50%';

            let isDragging = false;

            sticker.onmousedown = (e) => {
                isDragging = true;
                e.stopPropagation();
            };

            document.onmousemove = (e) => {
                if (!isDragging) return;
                const rect = mainContainer.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                
                if(x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                    sticker.style.left = x + 'px';
                    sticker.style.top = y + 'px';
                }
            };

            document.onmouseup = () => { isDragging = false; };

            sticker.onwheel = (e) => {
                e.preventDefault();
                let currentSize = parseFloat(window.getComputedStyle(sticker).fontSize);
                if (e.deltaY < 0) {
                    sticker.style.fontSize = (currentSize + 4) + 'px';
                } else {
                    if (currentSize > 15) sticker.style.fontSize = (currentSize - 4) + 'px';
                }
            };

            sticker.ondblclick = () => { sticker.remove(); };

            mainContainer.appendChild(sticker);
        }

        document.getElementById('uploadInput').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
                    ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);

                    refCtx.drawImage(img, 0, 0, refCanvas.width, refCanvas.height);
                    ctx.drawImage(img, 0, 0, mainCanvas.width, mainCanvas.height);

                    originalImageObj = img;
                    undoStack = [];
                    saveState();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function clearColorsOnly() {
            if (!originalImageObj) {
                alert("الرجاء رفع صورة أولاً!");
                return;
            }
            saveState();
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.drawImage(originalImageObj, 0, 0, mainCanvas.width, mainCanvas.height);
            saveState();
        }

        function clearAll() {
            if (confirm("هل أنت متأكد من مسح اللوحة بالكامل؟")) {
                ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
                refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
                originalImageObj = null;
                undoStack = [];
                document.querySelectorAll('.draggable-sticker').forEach(el => el.remove());
            }
        }

        mainCanvas.onmousedown = (e) => {
            saveState();
            drawing = true;
            const rect = mainCanvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        };

        mainCanvas.onmousemove = (e) => {
            if (!drawing) return;
            const rect = mainCanvas.getBoundingClientRect();
            const tool = document.getElementById('toolSelect').value;
            const size = document.getElementById('brushSize').value;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (tool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
            } else if (tool === 'pencil') {
                ctx.lineWidth = Math.min(size, 3);
                ctx.strokeStyle = currentColor;
            } else {
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        };

        mainCanvas.onmouseup = () => { drawing = false; ctx.beginPath(); };
        mainCanvas.onmouseleave = () => { drawing = false; ctx.beginPath(); };
    </script>
</body>
</html>
